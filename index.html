<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Chat Archive</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-surface: #ffffff;
            --bg-subtle: #f1f5f9;
            --border-color: #cbd5e1;
            --text-main: #020617;
            --text-muted: #475569;
        }

        body {
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            user-select: text;
            -webkit-user-select: text;
            font-size: 15px;
        }

        /* Monotone Markdown Styles - Enhanced Readability */
        .markdown-body { 
            color: #0f172a; 
            user-select: text; 
            -webkit-user-select: text; 
            font-size: 14.5px;
            line-height: 1.7;
        }
        .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
            font-weight: 700;
            margin-top: 1.5rem;
            margin-bottom: 0.85rem;
            color: #020617;
        }
        .markdown-body h1 { font-size: 1.45rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.4rem; }
        .markdown-body h2 { font-size: 1.25rem; }
        .markdown-body h3 { font-size: 1.12rem; }
        .markdown-body p { margin-bottom: 1rem; line-height: 1.75; color: #0f172a; }
        .markdown-body b, .markdown-body strong { font-weight: 700; color: #000000; }
        
        /* Unified List Spacing */
        .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-top: 0.5rem; margin-bottom: 1rem; }
        .markdown-body ol { list-style-type: decimal; padding-left: 1.5rem; margin-top: 0.5rem; margin-bottom: 1rem; }
        .markdown-body li { margin-bottom: 0.45rem; line-height: 1.7; color: #0f172a; }
        .markdown-body li > p { margin-bottom: 0.35rem; }
        
        .markdown-body blockquote {
            border-left: 4px solid #334155;
            padding-left: 1rem;
            color: #334155;
            margin-bottom: 1rem;
            background: #f1f5f9;
            padding-top: 0.6rem;
            padding-bottom: 0.6rem;
            border-radius: 0 0.375rem 0.375rem 0;
            font-size: 14px;
        }
        .markdown-body code:not(pre code) {
            background-color: #e2e8f0;
            color: #020617;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            font-size: 0.9em;
            font-family: monospace;
            font-weight: 600;
        }
        .markdown-body pre {
            background-color: #f1f5f9 !important;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 1rem;
            overflow-x: auto;
            margin-bottom: 1.1rem;
            user-select: text;
        }

        /* Enhanced Table Styles - Fixed width and auto line wrapping */
        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            margin-bottom: 1.25rem;
            font-size: 13.5px;
            text-align: left;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            overflow: hidden;
            table-layout: fixed;
            word-break: break-word;
            word-wrap: break-word;
        }
        .markdown-body th {
            background-color: #f1f5f9;
            color: #020617;
            font-weight: 700;
            padding: 0.6rem 0.85rem;
            border: 1px solid #cbd5e1;
            border-bottom: 2px solid #94a3b8;
            white-space: normal;
            word-break: break-word;
        }
        .markdown-body td {
            padding: 0.55rem 0.85rem;
            border: 1px solid #e2e8f0;
            color: #0f172a;
            white-space: pre-wrap;
            word-break: break-word;
            vertical-align: top;
        }
        .markdown-body tr:nth-child(even) {
            background-color: #f8fafc;
        }
        .markdown-body tr:hover {
            background-color: #f1f5f9;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-900 select-text">

    <!-- Header Navigation -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <!-- Brand Logo -->
            <div class="flex items-center space-x-3 cursor-pointer" onclick="resetFilters()">
                <div class="w-9 h-9 rounded-lg bg-slate-900 flex items-center justify-center text-white shadow">
                    <i class="fa-solid fa-box-archive text-base"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-none text-slate-950 tracking-tight">Archive</h1>
                    <span class="text-[12px] text-slate-600 font-medium">기록 아카이브</span>
                </div>
            </div>

            <!-- Header Actions -->
            <div class="flex items-center gap-2">
                <label title="구글 문서 다운로드 파일(.txt/.html) 업로드" class="px-3 py-2 text-xs font-semibold text-white bg-slate-900 hover:bg-slate-800 rounded-lg shadow-sm transition duration-150 flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-file-arrow-up"></i> 문서 업로드
                    <input type="file" id="docFileInput" accept=".txt,.html" class="hidden" onchange="handleDocFileUpload(event)">
                </label>
                <button onclick="exportJSON()" title="JSON 백업 파일 내보내기" class="px-3 py-2 text-xs font-medium text-slate-800 hover:bg-slate-100 border border-slate-300 rounded-lg transition duration-150 flex items-center gap-1.5 bg-white">
                    <i class="fa-solid fa-download"></i> 내보내기
                </button>
                <label title="JSON 백업 파일 불러오기" class="px-3 py-2 text-xs font-medium text-slate-800 hover:bg-slate-100 border border-slate-300 rounded-lg transition duration-150 flex items-center gap-1.5 cursor-pointer bg-white">
                    <i class="fa-solid fa-upload"></i> 불러오기
                    <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="importJSON(event)">
                </label>
                <button onclick="openFormModal()" class="px-3 py-2 text-xs font-medium text-slate-800 hover:bg-slate-100 border border-slate-300 rounded-lg transition duration-150 flex items-center gap-1.5 bg-white">
                    <i class="fa-solid fa-plus"></i> 직접 작성
                </button>
            </div>
        </div>
    </header>

    <!-- Main Layout Container -->
    <div class="max-w-7xl w-full mx-auto px-6 py-6 flex-grow flex flex-col md:flex-row gap-6">

        <!-- Sidebar (Left) -->
        <aside class="w-full md:w-64 shrink-0 space-y-5">
            <!-- Search Widget -->
            <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
                <label class="block text-[12px] font-bold text-slate-500 uppercase tracking-wider mb-2">검색</label>
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input type="text" id="searchInput" oninput="renderPosts()" placeholder="검색어 입력..." class="w-full bg-slate-50 text-slate-900 text-xs rounded-lg pl-8 pr-3 py-2 border border-slate-300 focus:outline-none focus:border-slate-500 transition">
                </div>
                <div class="flex items-center justify-between mt-3 pt-3 border-t border-slate-100">
                    <span class="text-xs text-slate-700 font-medium">답변만 보기</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="answerOnlyToggle" onchange="toggleAnswerOnlyGlobal()" class="sr-only peer">
                        <div class="w-8 h-4 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-slate-900 border border-slate-300"></div>
                    </label>
                </div>
            </div>

            <!-- Category Sidebar Section -->
            <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-[12px] font-bold text-slate-500 uppercase tracking-wider">카테고리</span>
                    <button onclick="openCategoryManageModal()" class="text-[11px] text-slate-600 hover:text-slate-950 font-medium flex items-center gap-1">
                        <i class="fa-solid fa-gear text-[10px]"></i> 관리
                    </button>
                </div>
                <ul id="sidebarCategoryList" class="space-y-1 text-xs">
                    <!-- Dynamic Categories -->
                </ul>
            </div>

            <!-- Tags Sidebar Section -->
            <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
                <div class="flex items-center justify-between mb-2.5">
                    <span class="text-[12px] font-bold text-slate-500 uppercase tracking-wider">태그</span>
                    <button onclick="setFilter(null)" class="text-[11px] text-slate-500 hover:text-slate-900">전체보기</button>
                </div>
                <div id="sidebarTagList" class="flex flex-wrap gap-1.5 text-xs">
                    <!-- Dynamic Tags -->
                </div>
            </div>
        </aside>

        <!-- Main Feed (Right) -->
        <main class="flex-grow min-w-0">
            <!-- Feed Stats Header -->
            <div class="flex items-center justify-between text-xs text-slate-600 mb-4 px-1">
                <span id="postCount" class="font-medium">총 0개의 대화 기록</span>
                <span id="activeFilterBadge" class="hidden text-slate-800 bg-slate-200 border border-slate-300 px-2 py-0.5 rounded text-[11px] font-medium"></span>
            </div>

            <!-- Post Cards Grid / List -->
            <div id="postsFeed" class="space-y-3"></div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden text-center py-16 border border-dashed border-slate-300 rounded-xl bg-white">
                <div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center mx-auto text-slate-500 mb-3">
                    <i class="fa-regular fa-folder-open text-lg"></i>
                </div>
                <h3 class="text-slate-800 font-semibold text-sm mb-1">저장된 대화 기록이 없습니다</h3>
                <p class="text-xs text-slate-500 max-w-xs mx-auto mb-4">상단의 "구글 문서 업로드" 버튼을 눌러 .txt/.html 백업 파일을 선택해 보세요.</p>
            </div>
        </main>
    </div>

    <!-- 1. 대화 상세 보기 팝업 모달 -->
    <div id="viewModal" class="fixed inset-0 z-50 hidden bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white border border-slate-200 rounded-xl w-full max-w-3xl overflow-hidden shadow-2xl transform transition-all my-8 max-h-[85vh] flex flex-col select-text">
            <div class="px-6 py-4 border-b border-slate-200 bg-slate-50/80 flex items-start justify-between gap-4 shrink-0">
                <div>
                    <div class="flex items-center gap-2 mb-1.5 flex-wrap">
                        <span id="modalDetailCategory" class="bg-slate-200 text-slate-800 px-2 py-0.5 rounded text-[11px] font-bold"></span>
                        <span id="modalDetailDate" class="text-xs text-slate-500 font-medium"></span>
                    </div>
                    <h2 id="modalDetailTitle" class="text-base font-bold text-slate-950 leading-snug"></h2>
                </div>
                <button onclick="closeViewModal()" class="text-slate-400 hover:text-slate-700 transition p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <div id="modalDetailBody" class="p-6 overflow-y-auto space-y-6 flex-grow text-[13.5px] select-text"></div>

            <div class="px-6 py-3 border-t border-slate-200 bg-slate-50/50 flex items-center justify-between gap-4 shrink-0 text-xs">
                <div id="modalDetailTags" class="flex flex-wrap gap-1.5"></div>
                <button onclick="closeViewModal()" class="px-4 py-1.5 bg-slate-900 text-white rounded-lg font-medium hover:bg-slate-800 transition">닫기</button>
            </div>
        </div>
    </div>

    <!-- 2. 카테고리 관리 모달 -->
    <div id="categoryModal" class="fixed inset-0 z-50 hidden bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white border border-slate-200 rounded-xl w-full max-w-md overflow-hidden shadow-2xl p-5">
            <div class="flex items-center justify-between pb-3 border-b border-slate-200 mb-4">
                <h3 class="font-bold text-slate-800 text-sm flex items-center gap-1.5">
                    <i class="fa-solid fa-folder-tree text-slate-600"></i> 카테고리 관리
                </h3>
                <button onclick="closeCategoryManageModal()" class="text-slate-400 hover:text-slate-700"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>

            <form onsubmit="handleAddCategory(event)" class="flex gap-2 mb-4">
                <input type="text" id="newCategoryInput" required placeholder="새 카테고리 이름..." class="flex-grow bg-slate-50 text-slate-800 text-xs rounded-lg px-3 py-2 border border-slate-200 focus:outline-none focus:border-slate-400">
                <button type="submit" class="px-3 py-2 bg-slate-900 text-white text-xs rounded-lg font-semibold hover:bg-slate-800 shrink-0">추가</button>
            </form>

            <div class="max-h-60 overflow-y-auto border border-slate-200 rounded-lg divide-y divide-slate-100 text-xs">
                <ul id="modalCategoryList"></ul>
            </div>
        </div>
    </div>

    <!-- 3. 대화 작성/수정 모달 -->
    <div id="formModal" class="fixed inset-0 z-50 hidden bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white border border-slate-200 rounded-xl w-full max-w-2xl overflow-hidden shadow-2xl transform transition-all my-8">
            <div class="flex items-center justify-between px-5 py-3.5 border-b border-slate-200 bg-slate-50">
                <h3 id="formModalTitle" class="font-bold text-slate-800 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-slate-600"></i> 새 대화 직접 작성
                </h3>
                <button onclick="closeFormModal()" class="text-slate-400 hover:text-slate-700 transition"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            
            <form id="chatForm" onsubmit="savePost(event)" class="p-5 space-y-4 text-xs">
                <input type="hidden" id="editPostId">

                <div>
                    <label class="block font-medium text-slate-700 mb-1">대화 제목 *</label>
                    <input type="text" id="formTitle" required placeholder="제목을 입력하세요..." class="w-full bg-slate-50 text-slate-800 rounded-lg p-2.5 border border-slate-200 focus:outline-none focus:border-slate-400">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">날짜</label>
                        <input type="date" id="formDate" required class="w-full bg-slate-50 text-slate-800 rounded-lg p-2.5 border border-slate-200 focus:outline-none focus:border-slate-400">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">카테고리</label>
                        <select id="formCategorySelect" class="w-full bg-slate-50 text-slate-800 rounded-lg p-2.5 border border-slate-200 focus:outline-none focus:border-slate-400"></select>
                    </div>
                </div>

                <div>
                    <label class="block font-medium text-slate-700 mb-1">태그 (쉼표로 구분)</label>
                    <input type="text" id="formTags" placeholder="예: 백업, 팁" class="w-full bg-slate-50 text-slate-800 rounded-lg p-2.5 border border-slate-200 focus:outline-none focus:border-slate-400">
                </div>

                <div id="dialoguesContainer" class="space-y-4">
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">질문 (Prompt)</label>
                        <textarea id="formQuestion" rows="3" placeholder="질문 내용..." class="w-full bg-slate-50 text-slate-800 rounded-lg p-2.5 border border-slate-200 focus:outline-none focus:border-slate-400"></textarea>
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">답변 (Gemini Response) *</label>
                        <textarea id="formAnswer" rows="6" required placeholder="답변 내용을 작성..." class="w-full bg-slate-50 text-slate-800 rounded-lg p-2.5 border border-slate-200 focus:outline-none focus:border-slate-400 font-mono"></textarea>
                    </div>
                </div>

                <div class="flex justify-end gap-2 pt-3 border-t border-slate-200">
                    <button type="button" onclick="closeFormModal()" class="px-4 py-2 text-slate-600 hover:bg-slate-100 bg-slate-50 border border-slate-200 rounded-lg transition">취소</button>
                    <button type="submit" class="px-5 py-2 text-white bg-slate-900 hover:bg-slate-800 rounded-lg font-semibold transition shadow-sm">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 hidden bg-slate-900 text-white px-4 py-2.5 rounded-lg shadow-xl text-xs flex items-center gap-2 border border-slate-700">
        <i id="toastIcon" class="fa-solid fa-circle-check text-slate-300"></i>
        <span id="toastMessage">처리되었습니다.</span>
    </div>

    <!-- Application Core Script -->
    <script>
        let posts = [];
        let categories = ["일반", "개발", "기획", "구글문서"];
        let activeTagFilter = null;
        let globalAnswerOnly = false;

        window.addEventListener('DOMContentLoaded', () => {
            marked.setOptions({
                highlight: function(code, lang) {
                    const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                    return hljs.highlight(code, { language }).value;
                },
                breaks: true
            });

            loadData();
            renderPosts();
            document.getElementById('formDate').valueAsDate = new Date();
        });

        function loadData() {
            const savedPosts = localStorage.getItem('gemini_archive_monotone_posts');
            const savedCats = localStorage.getItem('gemini_archive_categories');
            if (savedPosts) {
                try { posts = JSON.parse(savedPosts); } catch(e) { posts = []; }
            }
            if (savedCats) {
                try { categories = JSON.parse(savedCats); } catch(e) {}
            }
        }

        function saveData() {
            localStorage.setItem('gemini_archive_monotone_posts', JSON.stringify(posts));
            localStorage.setItem('gemini_archive_categories', JSON.stringify(categories));
        }

        function renderPosts() {
            const feed = document.getElementById('postsFeed');
            const emptyState = document.getElementById('emptyState');
            const searchKeyword = document.getElementById('searchInput').value.toLowerCase().trim();

            feed.innerHTML = '';

            const filteredPosts = posts.filter(post => {
                const turnsText = (post.turns || []).map(t => (t.question || '') + ' ' + (t.answer || '')).join(' ');
                const matchSearch = !searchKeyword || 
                    post.title.toLowerCase().includes(searchKeyword) ||
                    turnsText.toLowerCase().includes(searchKeyword) ||
                    (post.tags && post.tags.some(t => t.toLowerCase().includes(searchKeyword)));
                
                const matchTag = !activeTagFilter || 
                    post.category === activeTagFilter || 
                    (post.tags && post.tags.includes(activeTagFilter));

                return matchSearch && matchTag;
            });

            document.getElementById('postCount').innerText = `총 ${filteredPosts.length}개의 기록 (전체 ${posts.length}개)`;

            if (filteredPosts.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                filteredPosts.forEach(post => {
                    feed.appendChild(createPostCard(post));
                });
            }

            renderSidebar();
            highlightCodeBlocks();
        }

        function createPostCard(post) {
            const article = document.createElement('article');
            article.className = "bg-white border border-slate-200 rounded-xl p-4 shadow-sm hover:border-slate-400 hover:shadow transition duration-150 cursor-pointer flex flex-col justify-between gap-3";
            article.onclick = () => openViewModal(post.id);

            const turns = post.turns || [{ question: post.question || '', answer: post.answer || '' }];
            const firstQuestion = turns[0]?.question || '질문 내용 없음';

            const tagsHTML = (post.tags || []).map(tag => 
                `<span onclick="event.stopPropagation(); setFilter('${tag}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-2 py-0.5 rounded text-[11px] border border-slate-200 transition">#${tag}</span>`
            ).join(' ');

            article.innerHTML = `
                <div>
                    <div class="flex items-center justify-between gap-2 mb-1.5">
                        <div class="flex items-center gap-2 flex-wrap">
                            ${post.category ? `<span onclick="event.stopPropagation(); setFilter('${post.category}')" class="bg-slate-100 text-slate-800 border border-slate-200 px-2 py-0.5 rounded text-[11px] font-bold">${post.category}</span>` : ''}
                            <span class="text-[11px] text-slate-500 font-medium"><i class="fa-regular fa-calendar text-[10px] mr-1"></i>${post.date}</span>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="event.stopPropagation(); editPost('${post.id}')" title="수정" class="p-1 text-slate-400 hover:text-slate-800 rounded transition"><i class="fa-regular fa-pen-to-square text-xs"></i></button>
                            <button onclick="event.stopPropagation(); deletePost('${post.id}')" title="삭제" class="p-1 text-slate-400 hover:text-red-600 rounded transition"><i class="fa-regular fa-trash-can text-xs"></i></button>
                        </div>
                    </div>
                    <h2 class="text-[15px] font-bold text-slate-950 leading-snug mb-1">${escapeHTML(post.title)}</h2>
                    <p class="text-xs text-slate-600 line-clamp-2 leading-relaxed font-normal">${escapeHTML(firstQuestion)}</p>
                </div>

                ${(post.tags && post.tags.length > 0) ? `<div class="pt-2 border-t border-slate-100 flex flex-wrap gap-1.5">${tagsHTML}</div>` : ''}
            `;

            return article;
        }

        function handleDocFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                parseDocumentFile(file.name, content);
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function convertNodeToMarkdown(node) {
            if (node.nodeType === Node.TEXT_NODE) {
                return node.nodeValue;
            }
            if (node.nodeType !== Node.ELEMENT_NODE) {
                return '';
            }

            const tagName = node.tagName.toLowerCase();
            
            // 상단 레이아웃용, 네비게이션, 숨김 메타 태그는 아예 파싱에서 제외
            if (['style', 'script', 'head', 'meta', 'header', 'nav', 'footer', 'aside'].includes(tagName)) {
                return '';
            }

            // 숨겨진 요소나 레이아웃용 빈 표 방어 처리
            if (tagName === 'table') {
                const rows = Array.from(node.querySelectorAll('tr'));
                if (rows.length === 0) return '';

                // 의미 없는 1행 미만이거나 빈 셀들만 있는 레이아웃 테이블은 건너뜀
                const hasContent = rows.some(r => r.querySelectorAll('th, td').length > 0);
                if (!hasContent) return '';

                let tableMd = '\n\n';
                rows.forEach((row, rowIndex) => {
                    const cells = Array.from(row.querySelectorAll('th, td'));
                    if (cells.length === 0) return;

                    const rowText = cells.map(cell => {
                        // 셀 내부의 text Content 및 인라인 포맷팅을 안전하게 추출
                        let cellContent = getTableCellMarkdown(cell)
                            .replace(/\r?\n+/g, ' ')
                            .replace(/\|/g, '\\|')
                            .trim();
                        return cellContent;
                    }).join(' | ');

                    tableMd += `| ${rowText} |\n`;

                    if (rowIndex === 0) {
                        const separator = cells.map(() => '---').join(' | ');
                        tableMd += `| ${separator} |\n`;
                    }
                });
                return tableMd + '\n\n';
            }

            if (['thead', 'tbody', 'tfoot', 'tr', 'th', 'td'].includes(tagName)) {
                return Array.from(node.childNodes).map(convertNodeToMarkdown).join('');
            }

            let childrenMd = Array.from(node.childNodes).map(convertNodeToMarkdown).join('');

            let isBold = tagName === 'b' || tagName === 'strong';
            let isItalic = tagName === 'i' || tagName === 'em';

            if (isBold && childrenMd.trim()) childrenMd = `**${childrenMd.trim()}**`;
            if (isItalic && childrenMd.trim()) childrenMd = `*${childrenMd.trim()}*`;

            switch (tagName) {
                case 'h1': return `\n\n# ${childrenMd.trim()}\n\n`;
                case 'h2': return `\n\n## ${childrenMd.trim()}\n\n`;
                case 'h3': return `\n\n### ${childrenMd.trim()}\n\n`;
                case 'h4': return `\n\n#### ${childrenMd.trim()}\n\n`;
                case 'h5': return `\n\n##### ${childrenMd.trim()}\n\n`;
                case 'h6': return `\n\n###### ${childrenMd.trim()}\n\n`;
                case 'p': return `\n\n${childrenMd.trim()}\n\n`;
                case 'div': return `\n${childrenMd.trim()}\n`;
                case 'blockquote': return `\n\n${childrenMd.trim()}\n\n`;
                case 'pre': return `\n\n\`\`\`\n${node.innerText || childrenMd}\n\`\`\`\n\n`;
                case 'code': return node.parentNode && node.parentNode.tagName.toLowerCase() === 'pre' ? childrenMd : `\`${childrenMd.trim()}\``;
                case 'li': return `\n* ${childrenMd.trim()}`;
                case 'ul': case 'ol': return `\n${childrenMd}\n`;
                case 'br': return `\n`;
                case 'hr': return `\n\n---\n\n`;
                default: return childrenMd;
            }
        }

        // 표 내부 셀 파싱 전용 헬퍼 함수 (개행 문자로 인해 마크다운 표가 깨지거나 문서 최상단으로 분리되는 현원 방지)
        function getTableCellMarkdown(node) {
            if (node.nodeType === Node.TEXT_NODE) {
                return node.nodeValue;
            }
            if (node.nodeType !== Node.ELEMENT_NODE) {
                return '';
            }
            const tagName = node.tagName.toLowerCase();
            let childrenMd = Array.from(node.childNodes).map(getTableCellMarkdown).join(' ');

            let isBold = tagName === 'b' || tagName === 'strong';
            let isItalic = tagName === 'i' || tagName === 'em';

            if (isBold && childrenMd.trim()) childrenMd = `**${childrenMd.trim()}**`;
            if (isItalic && childrenMd.trim()) childrenMd = `*${childrenMd.trim()}*`;

            return childrenMd;
        }

        function parseDocumentFile(filename, rawContent) {
            let processedText = rawContent;

            if (filename.endsWith('.html')) {
                const parser = new DOMParser();
                const doc = parser.parseFromString(rawContent, 'text/html');
                
                // 불필요한 메타/헤더/사이드바 영역 요소를 DOM 레벨에서 원천 제거
                const removeSelectors = ['style', 'script', 'meta', 'head', 'header', 'nav', 'footer', '.header', '.menu', '.sidebar'];
                removeSelectors.forEach(selector => {
                    doc.querySelectorAll(selector).forEach(el => el.remove());
                });

                const bodyNode = doc.body || doc.documentElement;
                
                processedText = convertNodeToMarkdown(bodyNode)
                    .replace(/\n{3,}/g, '\n\n')
                    .trim();
            }

            processedText = processedText.replace(/^>\s*>\s*/gm, '');

            let title = filename.replace(/\.(txt|html)$/i, '');
            const lines = processedText.split('\n').map(l => l.trim()).filter(Boolean);
            if (lines.length > 0 && !lines[0].match(/User\s*prompt/i)) {
                title = lines[0].replace(/^#+\s*/, '').replace(/\*{2}/g, '');
            }

            const regex = /(User\s*prompt\s*:?|Response\s*:?)/gi;
            let matches = [];
            let match;
            while ((match = regex.exec(processedText)) !== null) {
                matches.push({ type: match[0].toLowerCase().includes('user') ? 'user' : 'response', index: match.index, length: match[0].length });
            }

            let turns = [];
            if (matches.length > 0) {
                for (let i = 0; i < matches.length; i++) {
                    const current = matches[i];
                    const nextIndex = (i + 1 < matches.length) ? matches[i + 1].index : processedText.length;
                    const content = processedText.substring(current.index + current.length, nextIndex).trim();

                    if (current.type === 'user') {
                        turns.push({ question: content, answer: '' });
                    } else if (current.type === 'response') {
                        if (turns.length === 0) turns.push({ question: '', answer: content });
                        else turns[turns.length - 1].answer = content;
                    }
                }
            } else {
                turns.push({ question: '', answer: processedText.trim() });
            }

            const defaultCat = categories.length > 0 ? categories[0] : "일반";
            const newPost = {
                id: 'doc-' + Date.now(),
                title: title || "구글 문서 대화 기록",
                date: new Date().toISOString().split('T')[0],
                category: defaultCat,
                tags: ["Docs", "자동백업"],
                turns: turns
            };

            posts.unshift(newPost);
            saveData();
            renderPosts();
            showToast('문서 파싱이 완료되었습니다.');
        }

        function sanitizeMarkdownContent(rawText) {
            if (!rawText) return '';
            let text = rawText.replace(/^[ \t]*[-*_]{3,}[ \t]*$/gm, '');
            text = text.replace(/^&gt;&gt;/gm, '>>');
            return text;
        }

        function renderSidebar() {
            const categoryContainer = document.getElementById('sidebarCategoryList');
            const tagContainer = document.getElementById('sidebarTagList');

            let categoryHTML = `
                <li>
                    <button onclick="setFilter(null)" class="w-full text-left px-2.5 py-1.5 rounded flex items-center justify-between ${!activeTagFilter ? 'bg-slate-900 text-white font-medium' : 'text-slate-600 hover:bg-slate-100'}">
                        <span>전체 목록</span>
                        <span class="text-[10px] opacity-70">${posts.length}</span>
                    </button>
                </li>
            `;

            categories.forEach(cat => {
                const count = posts.filter(p => p.category === cat).length;
                const active = activeTagFilter === cat;
                categoryHTML += `
                    <li>
                        <button onclick="setFilter('${cat}')" class="w-full text-left px-2.5 py-1.5 rounded flex items-center justify-between ${active ? 'bg-slate-900 text-white font-medium' : 'text-slate-600 hover:bg-slate-100'}">
                            <span class="truncate"><i class="fa-solid fa-folder text-[10px] mr-1.5 opacity-50"></i>${cat}</span>
                            <span class="text-[10px] opacity-70">${count}</span>
                        </button>
                    </li>
                `;
            });
            categoryContainer.innerHTML = categoryHTML;

            const tags = [...new Set(posts.flatMap(p => p.tags || []).filter(Boolean))];
            let tagHTML = '';
            tags.forEach(tag => {
                const active = activeTagFilter === tag;
                tagHTML += `
                    <button onclick="setFilter('${tag}')" class="px-2 py-1 rounded text-xs border transition ${active ? 'bg-slate-900 text-white border-slate-900 font-medium' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'}">
                        #${tag}
                    </button>
                `;
            });
            tagContainer.innerHTML = tagHTML || '<span class="text-xs text-slate-400">태그 없음</span>';

            const activeBadge = document.getElementById('activeFilterBadge');
            if (activeTagFilter) {
                activeBadge.innerText = `필터: ${activeTagFilter}`;
                activeBadge.classList.remove('hidden');
            } else {
                activeBadge.classList.add('hidden');
            }
        }

        function openCategoryManageModal() {
            renderModalCategoryList();
            document.getElementById('categoryModal').classList.remove('hidden');
        }

        function closeCategoryManageModal() {
            document.getElementById('categoryModal').classList.add('hidden');
        }

        function renderModalCategoryList() {
            const list = document.getElementById('modalCategoryList');
            list.innerHTML = categories.map((cat, index) => `
                <li class="p-2.5 flex items-center justify-between bg-white hover:bg-slate-50 transition">
                    <span class="font-medium text-slate-800">${escapeHTML(cat)}</span>
                    <div class="flex items-center gap-1.5">
                        <button onclick="moveCategory(${index}, -1)" ${index === 0 ? 'disabled class="text-slate-200 px-1"' : 'class="text-slate-500 hover:text-slate-900 px-1"'} title="위로 이동">
                            <i class="fa-solid fa-chevron-up text-xs"></i>
                        </button>
                        <button onclick="moveCategory(${index}, 1)" ${index === categories.length - 1 ? 'disabled class="text-slate-200 px-1"' : 'class="text-slate-500 hover:text-slate-900 px-1"'} title="아래로 이동">
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </button>
                        <button onclick="renameCategory('${escapeHTML(cat)}')" class="text-xs text-slate-400 hover:text-slate-700 ml-1">수정</button>
                        <button onclick="deleteCategory('${escapeHTML(cat)}')" class="text-xs text-slate-400 hover:text-red-600">삭제</button>
                    </div>
                </li>
            `).join('');
        }

        function moveCategory(index, direction) {
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= categories.length) return;
            
            const temp = categories[index];
            categories[index] = categories[targetIndex];
            categories[targetIndex] = temp;
            
            saveData();
            renderModalCategoryList();
            renderPosts();
        }

        function handleAddCategory(e) {
            e.preventDefault();
            const input = document.getElementById('newCategoryInput');
            const val = input.value.trim();
            if (val && !categories.includes(val)) {
                categories.push(val);
                saveData();
                renderModalCategoryList();
                renderPosts();
                input.value = '';
                showToast('카테고리가 추가되었습니다.');
            }
        }

        function renameCategory(oldName) {
            const newName = prompt('새로운 카테고리 이름을 입력하세요:', oldName);
            if (newName && newName.trim() && newName !== oldName) {
                const trimmed = newName.trim();
                const idx = categories.indexOf(oldName);
                if (idx !== -1) categories[idx] = trimmed;
                
                posts.forEach(p => { if (p.category === oldName) p.category = trimmed; });
                saveData();
                renderModalCategoryList();
                renderPosts();
                showToast('카테고리 이름이 수정되었습니다.');
            }
        }

        function deleteCategory(catName) {
            if (confirm(`'${catName}' 카테고리를 삭제하시겠습니까?`)) {
                categories = categories.filter(c => c !== catName);
                posts.forEach(p => { if (p.category === catName) p.category = ''; });
                saveData();
                renderModalCategoryList();
                renderPosts();
                showToast('카테고리가 삭제되었습니다.');
            }
        }

        function openFormModal(isEdit = false) {
            const select = document.getElementById('formCategorySelect');
            select.innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');

            document.getElementById('formModal').classList.remove('hidden');
            if (!isEdit) {
                document.getElementById('chatForm').reset();
                document.getElementById('editPostId').value = '';
                document.getElementById('formModalTitle').innerHTML = `<i class="fa-solid fa-pen-to-square text-slate-600"></i> 새 대화 직접 작성`;
                document.getElementById('formDate').valueAsDate = new Date();
            }
        }

        function closeFormModal() {
            document.getElementById('formModal').classList.add('hidden');
        }

        function savePost(e) {
            e.preventDefault();
            const editId = document.getElementById('editPostId').value;
            const title = document.getElementById('formTitle').value.trim();
            const date = document.getElementById('formDate').value;
            const category = document.getElementById('formCategorySelect').value;
            const tags = document.getElementById('formTags').value.split(',').map(t => t.trim()).filter(Boolean);
            const question = document.getElementById('formQuestion') ? document.getElementById('formQuestion').value.trim() : '';
            const answer = document.getElementById('formAnswer') ? document.getElementById('formAnswer').value.trim() : '';

            if (editId) {
                const index = posts.findIndex(p => p.id === editId);
                if (index !== -1) {
                    posts[index] = { ...posts[index], title, date, category, tags, turns: [{ question, answer }] };
                    showToast('대화 기록이 수정되었습니다.');
                }
            } else {
                posts.unshift({
                    id: 'post-' + Date.now(), title, date, category, tags,
                    turns: [{ question, answer }]
                });
                showToast('새 대화가 추가되었습니다.');
            }

            saveData();
            renderPosts();
            closeFormModal();
        }

        function editPost(id) {
            const post = posts.find(p => p.id === id);
            if (!post) return;

            openFormModal(true);
            document.getElementById('editPostId').value = post.id;
            document.getElementById('formTitle').value = post.title;
            document.getElementById('formDate').value = post.date;
            document.getElementById('formCategorySelect').value = post.category || categories[0];
            document.getElementById('formTags').value = post.tags ? post.tags.join(', ') : '';
            
            const firstTurn = (post.turns && post.turns[0]) || { question: post.question || '', answer: post.answer || '' };
            document.getElementById('formQuestion').value = firstTurn.question || '';
            document.getElementById('formAnswer').value = firstTurn.answer || '';
            
            document.getElementById('formModalTitle').innerHTML = `<i class="fa-solid fa-pen-to-square text-slate-600"></i> 대화 수정`;
        }

        function deletePost(id) {
            if (confirm('이 대화 기록을 삭제하시겠습니까?')) {
                posts = posts.filter(p => p.id !== id);
                saveData();
                renderPosts();
                showToast('기록이 삭제되었습니다.');
            }
        }

        function setFilter(filter) {
            activeTagFilter = filter;
            renderPosts();
        }

        function resetFilters() {
            activeTagFilter = null;
            document.getElementById('searchInput').value = '';
            document.getElementById('answerOnlyToggle').checked = false;
            globalAnswerOnly = false;
            renderPosts();
        }

        function toggleAnswerOnlyGlobal() {
            globalAnswerOnly = document.getElementById('answerOnlyToggle').checked;
            renderPosts();
        }

        function exportJSON() {
            const exportObj = { posts, categories };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObj, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `gemini_archive_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast('백업 파일 내보내기가 완료되었습니다.');
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        posts = imported;
                    } else if (imported.posts) {
                        posts = imported.posts;
                        if (imported.categories) categories = imported.categories;
                    }
                    saveData();
                    renderPosts();
                    showToast('데이터를 성공적으로 불러왔습니다.');
                } catch(err) {
                    alert('올바른 JSON 백업 파일이 아닙니다.');
                }
            };
            reader.readAsText(file);
        }

        function highlightCodeBlocks() {
            document.querySelectorAll('pre code').forEach((block) => {
                hljs.highlightElement(block);
            });
        }

        function copyToClipboard(text) {
            const tempInput = document.createElement('textarea');
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            showToast('답변 텍스트가 복사되었습니다.');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').innerText = message;
            toast.classList.remove('hidden');
            setTimeout(() => { toast.classList.add('hidden'); }, 3000);
        }

        function escapeHTML(str) {
            return (str || '')
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function escapeForAttribute(str) {
            return (str || '').replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\${/g, '\\${');
        }
    </script>
